document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-size:11px;font-weight:700;letter-spacing:0.08em;opacity:0.5;color:inherit;\">06<\u002Fspan><span style=\"font-family:'Chakra Petch',sans-serif;font-size:13.5px;font-weight:600;line-height:1.25;letter-spacing:-0.01em;color:inherit;\">Derivative-Based Strategies<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:absolute;left:90px;top:360px;transform:translate(-50%,-50%);width:150px;z-index:2;\" onmouseenter=\"{{ sel6 }}\" onclick=\"{{ sel6 }}\">\n            <div style=\"{{ box6 }}\"><span style=\"font-family:'Chakra Petch',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.08em;opacity:0.5;color:inherit;\">07<\u002Fspan><span style=\"font-family:'Chakra Petch',sans-serif;font-size:13.5px;font-weight:600;line-height:1.25;letter-spacing:-0.01em;color:inherit;\">Alternative Investments<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:absolute;left:169px;top:169px;transform:translate(-50%,-50%);width:150px;z-index:2;\" onmouseenter=\"{{ sel7 }}\" onclick=\"{{ sel7 }}\">\n            <div style=\"{{ box7 }}\"><span style=\"font-family:'Chakra Petch',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.08em;opacity:0.5;color:inherit;\">08<\u002Fspan><span style=\"font-family:'Chakra Petch',sans-serif;font-size:13.5px;font-weight:600;line-height:1.25;letter-spacing:-0.01em;color:inherit;\">Philanthropic Strategies<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-family:'Chakra Petch',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:rgba(27,46,75,0.4);text-align:center;margin-top:12px;\">Hover over a strategy to see how it connects<\u002Fp>\n        <div style=\"display:flex;gap:22px;justify-content:center;flex-wrap:wrap;margin-top:16px;\">\n          <div style=\"display:flex;align-items:center;gap:8px;\"><span style=\"width:18px;height:2.5px;border-radius:2px;background:#C2872E;\"><\u002Fspan><span style=\"font-family:'Chakra Petch',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#5a6a7e;\">Tax Losses<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:8px;\"><span style=\"width:18px;height:2.5px;border-radius:2px;background:#2F7E8C;\"><\u002Fspan><span style=\"font-family:'Chakra Petch',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#5a6a7e;\">Liquidity<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:8px;\"><span style=\"width:18px;height:2.5px;border-radius:2px;background:#93577A;\"><\u002Fspan><span style=\"font-family:'Chakra Petch',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#5a6a7e;\">Appreciated Gains<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:8px;\"><span style=\"width:18px;height:0;border-top:2px dashed rgba(27,46,75,0.4);\"><\u002Fspan><span style=\"font-family:'Chakra Petch',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#5a6a7e;\">Foundation<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- DETAIL PANEL -->\n      <div style=\"flex:1;min-width:340px;background:#fff;border:1px solid rgba(27,46,75,0.1);border-radius:12px;padding:34px 34px 30px;box-shadow:0 4px 24px rgba(27,46,75,0.05);align-self:stretch;display:flex;flex-direction:column;\">\n        <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;\">\n\n        <!-- INTRO -->\n        <div style=\"display:{{ showIntro }};\">\n          <div style=\"font-family:'Chakra Petch',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#5a6a7e;margin-bottom:14px;\">The STQ Approach<\u002Fdiv>\n          <h2 style=\"font-family:'Chakra Petch',sans-serif;font-size:26px;font-weight:700;color:#1B2E4B;letter-spacing:-0.01em;line-height:1.15;margin-bottom:18px;\">A coordinated approach<\u002Fh2>\n          <p style=\"font-size:15px;line-height:1.8;color:#4a5a6a;margin-bottom:28px;\">No strategy stands alone. A tax-aware core keeps the portfolio fully invested while each strategy directs liquidity, losses, and gains to where they are most useful. The result is a level of tax efficiency that individual strategies, used in isolation, rarely achieve.<\u002Fp>\n          <div style=\"font-family:'Chakra Petch',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:rgba(27,46,75,0.5);margin-bottom:16px;\">What connects the strategies<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:16px;\">\n            <div style=\"display:flex;gap:14px;align-items:flex-start;\"><span style=\"font-family:'Chakra Petch',sans-serif;font-size:13px;font-weight:700;color:#1B2E4B;min-width:128px;\">Tax Alpha<\u002Fspan><span style=\"font-size:13.5px;line-height:1.6;color:#5a6a7e;\">The objective — a measurably higher return after tax.<\u002Fspan><\u002Fdiv>\n            <div style=\"height:1px;background:rgba(27,46,75,0.08);\"><\u002Fdiv>\n            <div style=\"display:flex;gap:14px;align-items:flex-start;\"><span style=\"font-family:'Chakra Petch',sans-serif;font-size:13px;font-weight:700;color:#1B2E4B;min-width:128px;\">The Loss Bank<\u002Fspan><span style=\"font-size:13.5px;line-height:1.6;color:#5a6a7e;\">A shared reserve of harvested losses, available to offset future gains.<\u002Fspan><\u002Fdiv>\n            <div style=\"height:1px;background:rgba(27,46,75,0.08);\"><\u002Fdiv>\n            <div style=\"display:flex;gap:14px;align-items:flex-start;\"><span style=\"font-family:'Chakra Petch',sans-serif;font-size:13px;font-weight:700;color:#1B2E4B;min-width:128px;\">Box-Spread Liquidity<\u002Fspan><span style=\"font-size:13.5px;line-height:1.6;color:#5a6a7e;\">Liquidity drawn from the portfolio, with no need to sell holdings.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- 01 -->\n        <div style=\"display:{{ show0 }};\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;\"><span style=\"font-family:'Chakra Petch',sans-serif;font-size:13px;font-weight:700;color:rgba(27,46,75,0.3);\">01<\u002Fspan><span style=\"font-family:'Chakra Petch',sans-serif;font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:rgba(27,46,75,0.6);border:1px solid rgba(27,46,75,0.25);border-radius:20px;padding:4px 11px;\">Core Strategy<\u002Fspan><\u002Fdiv>\n          <h2 style=\"font-family:'Chakra Petch',sans-serif;font-size:24px;font-weight:700;color:#1B2E4B;letter-spacing:-0.01em;line-height:1.15;margin-bottom:12px;\">Portfolio Construction<\u002Fh2>\n          <p style=\"font-family:'Chakra Petch',sans-serif;font-size:16px;font-weight:600;color:#1B2E4B;line-height:1.4;opacity:0.85;margin-bottom:14px;\">The foundation: the right assets, held in the right accounts and vehicles, with the after-tax result considered first.<\u002Fp>\n          <p style=\"font-size:14.5px;line-height:1.8;color:#4a5a6a;margin-bottom:24px;\">Every other strategy builds on this layer. Allocation comes first, then asset location — where each holding lives — then the vehicle, chosen to minimize taxable events and maximize after-tax compounding.<\u002Fp>\n          <div style=\"font-family:'Chakra Petch',sans-serif;font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:rgba(27,46,75,0.5);margin-bottom:12px;\">Underpins<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;\"><span style=\"font-family:'Chakra Petch',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:rgba(27,46,75,0.7);border:1px solid rgba(27,46,75,0.22);border-radius:20px;padding:5px 11px;\">All eight strategies<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- 02 -->\n        <div style=\"display:{{ show1 }};\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;\"><span style=\"font-family:'Chakra Petch',sans-serif;font-size:13px;font-weight:700;color:rgba(27,46,75,0.3);\">02<\u002Fspan><span style=\"font-family:'Chakra Petch',sans-serif;font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:rgba(27,46,75,0.6);border:1px solid rgba(27,46,75,0.25);border-radius:20px;padding:4px 11px;\">Liquidity<\u002Fspan><\u002Fdiv>\n          <h2 style=\"font-family:'Chakra Petch',sans-serif;font-size:24px;font-weight:700;color:#1B2E4B;letter-spacing:-0.01em;line-height:1.15;margin-bottom:12px;\">Synthetic Financing<\u002Fh2>\n          <p style=\"font-family:'Chakra Petch',sans-serif;font-size:16px;font-weight:600;color:#1B2E4B;line-height:1.4;opacity:0.85;margin-bottom:14px;\">Access liquidity by borrowing against your portfolio at rates near Treasury levels.<\u002Fp>\n          <p style=\"font-size:14.5px;line-height:1.8;color:#4a5a6a;margin-bottom:24px;\">A four-leg options structure with a known payoff creates liquidity with no credit check, no bank approval, and no forced selling. The portfolio stays fully invested; the interest is potentially tax-deductible.<\u002Fp>\n          <div style=\"font-family:'Chakra Petch',sans-serif;font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:rgba(27,46,75,0.5);margin-bottom:12px;\">Feeds<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;\"><span style=\"font-family:'Chakra Petch',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:rgba(27,46,75,0.7);border:1px solid rgba(27,46,75,0.22);border-radius:20px;padding:5px 11px;\">Concentrated Positions<\u002Fspan><span style=\"font-family:'Chakra Petch',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:rgba(27,46,75,0.7);border:1px solid rgba(27,46,75,0.22);border-radius:20px;padding:5px 11px;\">Alternatives<\u002Fspan><span style=\"font-family:'Chakra Petch',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:rgba(27,46,75,0.7);border:1px solid rgba(27,46,75,0.22);border-radius:20px;padding:5px 11px;\">No forced selling<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- 03 -->\n        <div style=\"display:{{ show2 }};\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;\"><span style=\"font-family:'Chakra Petch',sans-serif;font-size:13px;font-weight:700;color:rgba(27,46,75,0.3);\">03<\u002Fspan><span style=\"font-family:'Chakra Petch',sans-serif;font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:rgba(27,46,75,0.6);border:1px solid rgba(27,46,75,0.25);border-radius:20px;padding:4px 11px;\">Tax Alpha<\u002Fspan><\u002Fdiv>\n          <h2 style=\"font-family:'Chakra Petch',sans-serif;font-size:24px;font-weight:700;color:#1B2E4B;letter-spacing:-0.01em;line-height:1.15;margin-bottom:12px;\">Customized Direct Indexing<\u002Fh2>\n          <p style=\"font-family:'Chakra Petch',sans-serif;font-size:16px;font-weight:600;color:#1B2E4B;line-height:1.4;opacity:0.85;margin-bottom:14px;\">Broad index exposure with tax management built in.<\u002Fp>\n          <p style=\"font-size:14.5px;line-height:1.8;color:#4a5a6a;margin-bottom:24px;\">Owning the individual names — not a fund — lets us harvest losses at the security level even when the index is up, and build an index shaped around your existing holdings and tax situation.<\u002Fp>\n          <div style=\"font-family:'Chakra Petch',sans-serif;font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:rgba(27,46,75,0.5);margin-bottom:12px;\">Feeds<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;\"><span style=\"font-family:'Chakra Petch',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:rgba(27,46,75,0.7);border:1px solid rgba(27,46,75,0.22);border-radius:20px;padding:5px 11px;\">The Loss Bank<\u002Fspan><span style=\"font-family:'Chakra Petch',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:rgba(27,46,75,0.7);border:1px solid rgba(27,46,75,0.22);border-radius:20px;padding:5px 11px;\">Concentrated unwinds<\u002Fspan><span style=\"font-family:'Chakra Petch',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:rgba(27,46,75,0.7);border:1px solid rgba(27,46,75,0.22);border-radius:20px;padding:5px 11px;\">Gifting lots<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- 04 -->\n        <div style=\"display:{{ show3 }};\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;\"><span style=\"font-family:'Chakra Petch',sans-serif;font-size:13px;font-weight:700;color:rgba(27,46,75,0.3);\">04<\u002Fspan><span style=\"font-family:'Chakra Petch',sans-serif;font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:rgba(27,46,75,0.6);border:1px solid rgba(27,46,75,0.25);border-radius:20px;padding:4px 11px;\">Tax Alpha<\u002Fspan><\u002Fdiv>\n          <h2 style=\"font-family:'Chakra Petch',sans-serif;font-size:24px;font-weight:700;color:#1B2E4B;letter-spacing:-0.01em;line-height:1.15;margin-bottom:12px;\">Long/Short Tax-Loss Harvesting<\u002Fh2>\n          <p style=\"font-family:'Chakra Petch',sans-serif;font-size:16px;font-weight:600;color:#1B2E4B;line-height:1.4;opacity:0.85;margin-bottom:14px;\">Putting market volatility to work as a tax advantage.<\u002Fp>\n          <p style=\"font-size:14.5px;line-height:1.8;color:#4a5a6a;margin-bottom:24px;\">Long-short strategies generate losses regardless of market direction. Each harvested loss is deposited in the loss bank, ready to deploy against gains — a real estate sale, a business exit, an RSU vest.<\u002Fp>\n          <div style=\"font-family:'Chakra Petch',sans-serif;font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:rgba(27,46,75,0.5);margin-bottom:12px;\">Feeds<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;\"><span style=\"font-family:'Chakra Petch',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:rgba(27,46,75,0.7);border:1px solid rgba(27,46,75,0.22);border-radius:20px;padding:5px 11px;\">The Loss Bank<\u002Fspan><span style=\"font-family:'Chakra Petch',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:rgba(27,46,75,0.7);border:1px solid rgba(27,46,75,0.22);border-radius:20px;padding:5px 11px;\">Offsets gains anywhere<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- 05 -->\n        <div style=\"display:{{ show4 }};\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;\"><span style=\"font-family:'Chakra Petch',sans-serif;font-size:13px;font-weight:700;color:rgba(27,46,75,0.3);\">05<\u002Fspan><span style=\"font-family:'Chakra Petch',sans-serif;font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:rgba(27,46,75,0.6);border:1px solid rgba(27,46,75,0.25);border-radius:20px;padding:4px 11px;\">Risk Management<\u002Fspan><\u002Fdiv>\n          <h2 style=\"font-family:'Chakra Petch',sans-serif;font-size:24px;font-weight:700;color:#1B2E4B;letter-spacing:-0.01em;line-height:1.15;margin-bottom:12px;\">Concentrated Position Management<\u002Fh2>\n          <p style=\"font-family:'Chakra Petch',sans-serif;font-size:16px;font-weight:600;color:#1B2E4B;line-height:1.4;opacity:0.85;margin-bottom:14px;\">Reducing concentration risk without an unnecessary tax burden.<\u002Fp>\n          <p style=\"font-size:14.5px;line-height:1.8;color:#4a5a6a;margin-bottom:24px;\">Unwinding a concentrated position is a tax problem as much as a risk problem. It draws on the entire toolkit to diversify on your terms — without surrendering an outsized share to taxes.<\u002Fp>\n          <div style=\"font-family:'Chakra Petch',sans-serif;font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:rgba(27,46,75,0.5);margin-bottom:12px;\">Draws on<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;\"><span style=\"font-family:'Chakra Petch',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:rgba(27,46,75,0.7);border:1px solid rgba(27,46,75,0.22);border-radius:20px;padding:5px 11px;\">Box-spread loans<\u002Fspan><span style=\"font-family:'Chakra Petch',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:rgba(27,46,75,0.7);border:1px solid rgba(27,46,75,0.22);border-radius:20px;padding:5px 11px;\">The Loss Bank<\u002Fspan><span style=\"font-family:'Chakra Petch',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:rgba(27,46,75,0.7);border:1px solid rgba(27,46,75,0.22);border-radius:20px;padding:5px 11px;\">Collars &amp; VPFs<\u002Fspan><span style=\"font-family:'Chakra Petch',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:rgba(27,46,75,0.7);border:1px solid rgba(27,46,75,0.22);border-radius:20px;padding:5px 11px;\">DAF gifting<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- 06 -->\n        <div style=\"display:{{ show5 }};\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;\"><span style=\"font-family:'Chakra Petch',sans-serif;font-size:13px;font-weight:700;color:rgba(27,46,75,0.3);\">06<\u002Fspan><span style=\"font-family:'Chakra Petch',sans-serif;font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:rgba(27,46,75,0.6);border:1px solid rgba(27,46,75,0.25);border-radius:20px;padding:4px 11px;\">Options Overlay<\u002Fspan><\u002Fdiv>\n          <h2 style=\"font-family:'Chakra Petch',sans-serif;font-size:24px;font-weight:700;color:#1B2E4B;letter-spacing:-0.01em;line-height:1.15;margin-bottom:12px;\">Derivative-Based Strategies<\u002Fh2>\n          <p style=\"font-family:'Chakra Petch',sans-serif;font-size:16px;font-weight:600;color:#1B2E4B;line-height:1.4;opacity:0.85;margin-bottom:14px;\">Using options to manage risk and enhance income, without triggering a taxable sale.<\u002Fp>\n          <p style=\"font-size:14.5px;line-height:1.8;color:#4a5a6a;margin-bottom:24px;\">Protective put spreads, covered calls, collars: precision tools to hedge downside, generate yield, and reshape exposure. Every structure is evaluated through a tax lens first.<\u002Fp>\n          <div style=\"font-family:'Chakra Petch',sans-serif;font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:rgba(27,46,75,0.5);margin-bottom:12px;\">Feeds<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;\"><span style=\"font-family:'Chakra Petch',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:rgba(27,46,75,0.7);border:1px solid rgba(27,46,75,0.22);border-radius:20px;padding:5px 11px;\">Hedges Concentrated Positions<\u002Fspan><span style=\"font-family:'Chakra Petch',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:rgba(27,46,75,0.7);border:1px solid rgba(27,46,75,0.22);border-radius:20px;padding:5px 11px;\">Reshapes exposure<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- 07 -->\n        <div style=\"display:{{ show6 }};\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;\"><span style=\"font-family:'Chakra Petch',sans-serif;font-size:13px;font-weight:700;color:rgba(27,46,75,0.3);\">07<\u002Fspan><span style=\"font-family:'Chakra Petch',sans-serif;font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:rgba(27,46,75,0.6);border:1px solid rgba(27,46,75,0.25);border-radius:20px;padding:4px 11px;\">Alternatives<\u002Fspan><\u002Fdiv>\n          <h2 style=\"font-family:'Chakra Petch',sans-serif;font-size:24px;font-weight:700;color:#1B2E4B;letter-spacing:-0.01em;line-height:1.15;margin-bottom:12px;\">Alternative Investments<\u002Fh2>\n          <p style=\"font-family:'Chakra Petch',sans-serif;font-size:16px;font-weight:600;color:#1B2E4B;line-height:1.4;opacity:0.85;margin-bottom:14px;\">Private-market exposure to reduce correlation and broaden sources of return.<\u002Fp>\n          <p style=\"font-size:14.5px;line-height:1.8;color:#4a5a6a;margin-bottom:24px;\">Private equity, credit, venture, and real assets reduce correlation. Placement matters as much as selection — ordinary-income funds in tax-deferred accounts, long-gain funds in taxable ones.<\u002Fp>\n          <div style=\"font-family:'Chakra Petch',sans-serif;font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:rgba(27,46,75,0.5);margin-bottom:12px;\">Draws on<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;\"><span style=\"font-family:'Chakra Petch',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:rgba(27,46,75,0.7);border:1px solid rgba(27,46,75,0.22);border-radius:20px;padding:5px 11px;\">Box-spread liquidity<\u002Fspan><span style=\"font-family:'Chakra Petch',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:rgba(27,46,75,0.7);border:1px solid rgba(27,46,75,0.22);border-radius:20px;padding:5px 11px;\">Asset location<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- 08 -->\n        <div style=\"display:{{ show7 }};\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;\"><span style=\"font-family:'Chakra Petch',sans-serif;font-size:13px;font-weight:700;color:rgba(27,46,75,0.3);\">08<\u002Fspan><span style=\"font-family:'Chakra Petch',sans-serif;font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:rgba(27,46,75,0.6);border:1px solid rgba(27,46,75,0.25);border-radius:20px;padding:4px 11px;\">Wealth Transfer<\u002Fspan><\u002Fdiv>\n          <h2 style=\"font-family:'Chakra Petch',sans-serif;font-size:24px;font-weight:700;color:#1B2E4B;letter-spacing:-0.01em;line-height:1.15;margin-bottom:12px;\">Philanthropic Strategies<\u002Fh2>\n          <p style=\"font-family:'Chakra Petch',sans-serif;font-size:16px;font-weight:600;color:#1B2E4B;line-height:1.4;opacity:0.85;margin-bottom:14px;\">Charitable giving structured for greater tax efficiency.<\u002Fp>\n          <p style=\"font-size:14.5px;line-height:1.8;color:#4a5a6a;margin-bottom:24px;\">A donor-advised fund gives you the full deduction today and lets you grant on your own timeline. Donating appreciated stock directly eliminates the capital gain entirely — draining built-up gains from concentrated positions.<\u002Fp>\n          <div style=\"font-family:'Chakra Petch',sans-serif;font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:rgba(27,46,75,0.5);margin-bottom:12px;\">Draws on<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;\"><span style=\"font-family:'Chakra Petch',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:rgba(27,46,75,0.7);border:1px solid rgba(27,46,75,0.22);border-radius:20px;padding:5px 11px;\">Appreciated stock<\u002Fspan><span style=\"font-family:'Chakra Petch',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:rgba(27,46,75,0.7);border:1px solid rgba(27,46,75,0.22);border-radius:20px;padding:5px 11px;\">Concentrated gains<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <\u002Fdiv>\n        <div style=\"margin-top:26px;padding-top:22px;border-top:1px solid rgba(27,46,75,0.08);display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;\">\n          <span style=\"font-size:12.5px;line-height:1.5;color:#5a6a7e;\">Each strategy is tailored to your tax situation, holdings, and objectives.<\u002Fspan>\n          <a href=\"#\" style=\"font-family:'Chakra Petch',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#1B2E4B;text-decoration:none;white-space:nowrap;border-bottom:1px solid rgba(27,46,75,0.3);padding-bottom:3px;\">Schedule a Consultation<\u002Fa>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- CONNECTIVE TISSUE -->\n    <sc-if value=\"{{ showTissue }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"margin-top:64px;\">\n      <div style=\"font-family:'Chakra Petch',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#5a6a7e;margin-bottom:28px;position:relative;padding-left:22px;\"><span style=\"position:absolute;left:0;top:50%;width:12px;height:1.5px;background:#1B2E4B;\"><\u002Fspan>How the Strategies Connect<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:22px;\">\n        <div style=\"background:#fff;border:1px solid rgba(27,46,75,0.08);border-left:3px solid #1B2E4B;border-radius:0 8px 8px 0;padding:28px 26px;\">\n          <h3 style=\"font-family:'Chakra Petch',sans-serif;font-size:18px;font-weight:700;color:#1B2E4B;margin-bottom:14px;\">Tax Alpha<\u002Fh3>\n          <p style=\"font-size:14px;line-height:1.75;color:#5a6a7e;\">The objective of the entire approach. Harvested losses and deferred gains compound over time into a higher return after tax — the return that ultimately reaches you.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid rgba(27,46,75,0.08);border-left:3px solid #1B2E4B;border-radius:0 8px 8px 0;padding:28px 26px;\">\n          <h3 style=\"font-family:'Chakra Petch',sans-serif;font-size:18px;font-weight:700;color:#1B2E4B;margin-bottom:14px;\">The Loss Bank<\u002Fh3>\n          <p style=\"font-size:14px;line-height:1.75;color:#5a6a7e;\">A shared reserve of realized losses. Direct indexing and long/short harvesting build it; concentrated unwinds and major gain events draw on it. The earlier it is established, the more valuable it becomes.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid rgba(27,46,75,0.08);border-left:3px solid #1B2E4B;border-radius:0 8px 8px 0;padding:28px 26px;\">\n          <h3 style=\"font-family:'Chakra Petch',sans-serif;font-size:18px;font-weight:700;color:#1B2E4B;margin-bottom:14px;\">Box-Spread Liquidity<\u002Fh3>\n          <p style=\"font-size:14px;line-height:1.75;color:#5a6a7e;\">A flexible source of liquidity. Borrowing against the portfolio can fund new positions, alternatives, and concentrated-stock transitions without selling holdings or realizing a gain.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- S T Q FRAMEWORK STRIP -->\n    <sc-if value=\"{{ showFramework }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"margin-top:28px;background:#1B2E4B;border-radius:12px;padding:40px 44px;display:flex;align-items:center;gap:44px;flex-wrap:wrap;position:relative;overflow:hidden;\">\n      <div style=\"position:absolute;right:32px;top:50%;transform:translateY(-50%);font-family:'Chakra Petch',sans-serif;font-size:160px;font-weight:700;color:rgba(240,239,235,0.04);line-height:1;pointer-events:none;letter-spacing:-0.04em;\">STQ<\u002Fdiv>\n      <div style=\"display:flex;gap:18px;align-items:center;position:relative;\">\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px;\"><span style=\"width:48px;height:48px;border-radius:50%;border:2px solid rgba(240,239,235,0.35);display:flex;align-items:center;justify-content:center;font-family:'Chakra Petch',sans-serif;font-size:20px;font-weight:700;color:#F0EFEB;\">S<\u002Fspan><span style=\"font-family:'Chakra Petch',sans-serif;font-size:9.5px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:rgba(240,239,235,0.55);\">Strategic<\u002Fspan><\u002Fdiv>\n        <span style=\"width:24px;height:1.5px;background:rgba(240,239,235,0.25);margin-bottom:20px;\"><\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px;\"><span style=\"width:48px;height:48px;border-radius:50%;border:2px solid rgba(240,239,235,0.35);display:flex;align-items:center;justify-content:center;font-family:'Chakra Petch',sans-serif;font-size:20px;font-weight:700;color:#F0EFEB;\">T<\u002Fspan><span style=\"font-family:'Chakra Petch',sans-serif;font-size:9.5px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:rgba(240,239,235,0.55);\">Tactical<\u002Fspan><\u002Fdiv>\n        <span style=\"width:24px;height:1.5px;background:rgba(240,239,235,0.25);margin-bottom:20px;\"><\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px;\"><span style=\"width:48px;height:48px;border-radius:50%;border:2px solid rgba(240,239,235,0.35);display:flex;align-items:center;justify-content:center;font-family:'Chakra Petch',sans-serif;font-size:20px;font-weight:700;color:#F0EFEB;\">Q<\u002Fspan><span style=\"font-family:'Chakra Petch',sans-serif;font-size:9.5px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:rgba(240,239,235,0.55);\">Quantitative<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;min-width:280px;position:relative;\">\n        <h3 style=\"font-family:'Chakra Petch',sans-serif;font-size:21px;font-weight:700;color:#F0EFEB;margin-bottom:8px;letter-spacing:-0.01em;\">The discipline behind the approach<\u002Fh3>\n        <p style=\"font-size:14.5px;line-height:1.7;color:rgba(240,239,235,0.7);max-width:540px;\">Strategic allocation sets the foundation. Tactical allocation adapts it as conditions change. Quantitative discipline keeps every decision measured and accountable to data.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1240,&quot;height&quot;:1240},&quot;startFocus&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;None&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;None&quot;,&quot;01 Portfolio Construction&quot;,&quot;02 Synthetic Financing&quot;,&quot;03 Direct Indexing&quot;,&quot;04 Long/Short Harvesting&quot;,&quot;05 Concentrated Positions&quot;,&quot;06 Derivatives&quot;,&quot;07 Alternatives&quot;,&quot;08 Philanthropic&quot;],&quot;section&quot;:&quot;Behavior&quot;},&quot;showConnectiveTissue&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;},&quot;showFramework&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.NODES = [[360,90],[551,169],[630,360],[551,551],[360,630],[169,551],[90,360],[169,169]];\n    this.CONN = [[1,2,3,4,5,6,7],[0,4,6],[0,3,4,7],[0,2,4],[1,2,3,5,7],[0,4],[0,1],[2,4]];\n    // Flow colors\n    this.FLOW = { loss:'#C2872E', liq:'#2F7E8C', gain:'#93577A', found:'#1B2E4B' };\n    // Edge type by node pair (min-max). Unlisted pairs that touch node 0 = foundation.\n    this.TYPE = {\n      '1-4':'liq', '1-6':'liq',\n      '2-3':'loss', '3-4':'loss',\n      '2-4':'gain', '2-7':'gain', '4-7':'gain', '4-5':'gain'\n    };\n    this.state = { active: this.startIdx() };\n  }\n\n  startIdx() {\n    const s = (this.props && this.props.startFocus) || 'None';\n    if (s === 'None') return null;\n    const n = parseInt(s.slice(0,2), 10);\n    return isNaN(n) ? null : n - 1;\n  }\n\n  edgeType(i, j) {\n    const key = Math.min(i,j) + '-' + Math.max(i,j);\n    if (this.TYPE[key]) return this.TYPE[key];\n    return 'found';\n  }\n\n  buildLines() {\n    const N = this.NODES, hub = [360,360], NAVY = '#1B2E4B', a = this.state.active;\n    const E = React.createElement;\n    const els = [];\n    els.push(E('circle', {key:'ring', cx:360, cy:360, r:270, fill:'none', stroke:NAVY, strokeOpacity:0.09, strokeWidth:1, strokeDasharray:'2 7'}));\n    const ln = (p,q,col,o,w,k,dash) => E('line', {key:k, x1:p[0], y1:p[1], x2:q[0], y2:q[1], stroke:col, strokeOpacity:o, strokeWidth:w, strokeLinecap:'round', strokeDasharray:dash||null});\n    const dot = (p,k,r,col,o) => E('circle', {key:k, cx:p[0], cy:p[1], r:r, fill:col, fillOpacity:o});\n    if (a === null) {\n      N.forEach((p,i) => els.push(ln(hub, p, NAVY, 0.10, 1, 's'+i)));\n    } else {\n      // link to engine (foundation, dashed neutral)\n      els.push(ln(N[a], hub, NAVY, 0.32, 1.4, 'h', '3 5'));\n      this.CONN[a].forEach((c,j) => {\n        const t = this.edgeType(a, c);\n        const col = this.FLOW[t];\n        els.push(ln(N[a], N[c], col, t==='found'?0.4:0.85, t==='found'?1.4:2.2, 'l'+j, t==='found'?'3 5':null));\n        els.push(dot(N[c], 'd'+j, 4.5, col, 0.95));\n      });\n      els.push(dot(hub, 'dh', 5, NAVY, 0.5));\n      els.push(dot(N[a], 'da', 5.5, NAVY, 1));\n    }\n    return E('svg', {viewBox:'0 0 720 720', style:{position:'absolute', inset:0, width:'100%', height:'100%', pointerEvents:'none', overflow:'visible'}}, els);\n  }\n\n  renderVals() {\n    const a = this.state.active;\n    const common = \"position:relative;border-radius:7px;padding:11px 13px;display:flex;flex-direction:column;gap:3px;transition:all .25s ease;cursor:default;\";\n    const normal = common + \"background:#fff;border:1px solid rgba(27,46,75,0.15);box-shadow:0 1px 3px rgba(27,46,75,0.05);color:#1B2E4B;\";\n    const activeS = common + \"background:#1B2E4B;border:1px solid #1B2E4B;box-shadow:0 10px 34px rgba(27,46,75,0.28);color:#F0EFEB;\";\n    const rel = common + \"background:#fff;border:1px solid rgba(27,46,75,0.55);box-shadow:0 6px 20px rgba(27,46,75,0.14);color:#1B2E4B;\";\n    const dim = common + \"background:#fff;border:1px solid rgba(27,46,75,0.1);box-shadow:none;color:#1B2E4B;opacity:0.4;\";\n    const conns = a === null ? [] : this.CONN[a];\n    const bs = (i) => { if (a === null) return normal; if (i === a) return activeS; if (conns.indexOf(i) >= 0) return rel; return dim; };\n\n    const out = {\n      linesLayer: this.buildLines(),\n      clear: () => this.setState({ active: null }),\n      showIntro: a === null ? 'block' : 'none',\n      showTissue: this.props.showConnectiveTissue !== false,\n      showFramework: this.props.showFramework !== false,\n    };\n    for (let i = 0; i < 8; i++) {\n      out['box'+i] = bs(i);\n      out['sel'+i] = () => this.setState({ active: i });\n      out['show'+i] = (a === i) ? 'block' : 'none';\n    }\n    return out;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
