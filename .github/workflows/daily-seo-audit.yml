name: Daily SEO and AI-surface run

# Every business morning: audit every public page for the signals search and
# AI engines rely on (failing loudly if anything broke), and regenerate
# llms-full.txt from current page text so AI crawlers always ingest fresh
# content, including the daily rate benchmarks. A commit here triggers the
# IndexNow workflow, which pings search engines.

on:
  schedule:
    - cron: '47 13 * * 1-5'   # 13:47 UTC daily Mon-Fri (~6am PT)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-seo-audit
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: SEO and AI-surface audit
        id: audit
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/seo-audit.mjs 2>&1 | tee audit-output.txt

      - name: Regenerate llms-full.txt from current pages
        run: python3 scripts/generate-llms-full.py

      - name: Update status dashboard
        run: |
          export AUDIT_RESULT="${{ steps.audit.outcome == 'success' && 'pass' || 'fail' }}"
          export AUDIT_SUMMARY="$(tail -1 audit-output.txt)"
          export RUN_SOURCE="${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}"
          node scripts/build-status-page.mjs
          rm -f audit-output.txt

      - name: Commit if content changed
        run: |
          if [[ -n "$(git status --porcelain llms-full.txt seo-status.html seo-status.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add llms-full.txt seo-status.html seo-status.json
            git commit -m "Daily optimization run: refresh AI ingestion file and status dashboard"
            git push
          else
            echo "No changes."
          fi

      - name: Fail workflow if audit failed
        if: steps.audit.outcome != 'success'
        run: exit 1
